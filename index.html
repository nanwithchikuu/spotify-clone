<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="menu">
            <img src="assets/menu.svg" alt="">
        </div>
        <div class="home">
            <ul>
                <li><img src="assets/home.svg" alt=""></li>
                <li><button><img src="assets/search.svg" alt="">What do you want to play?</button></li>
            </ul>
        </div>
        <div class="explore">
            <ul>
                <li><button>Explore premium</button></li>
                <li><img src="assets/bell.svg" alt=""></li>
                <li><img src="assets/group.svg" alt=""></li>
                <li><img src="assets/image.png" alt=""></li>
            </ul>
        </div>
    </div>
    <div class="header">
        <div class="box1">
            <div class="box1-minor">\
                <div class="library"><img src="assets/library.svg" alt=""></div>
                <div class="plus"><img src="assets/plus.svg" alt=""></div>
            </div>
        </div>
        <div class="box2">
            <div class="button">
                <button>ALL</button>
                <div class="btn-group">

                    <button class="music-btn" onclick="showFollow()">
                        Taylor Swift
                    </button>

                    <button class="follow-btn" id="followBtn">
                        FOLLOW
                    </button>

                </div>
                <button>Following</button>
                <button>Podcast</button>
                <button>Following</button>
            </div>
        </div>
        <div class="box3"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
